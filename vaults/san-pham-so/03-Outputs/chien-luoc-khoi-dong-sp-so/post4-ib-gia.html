<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:1200px;}
  body{font-family:'Liberation Sans','DejaVu Sans',sans-serif;color:#fff;overflow:hidden;
    background:radial-gradient(900px 620px at 80% 14%,rgba(232,69,10,.22),transparent 60%),
      linear-gradient(160deg,#1c1712 0%,#14110d 55%,#0f0d0a 100%);}
  .wrap{position:absolute;inset:0;padding:70px 74px;display:flex;flex-direction:column;justify-content:center;}
  .brand{display:flex;align-items:center;gap:13px;margin-bottom:26px;}
  .tick{width:50px;height:50px;border-radius:14px;background:#e8450a;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(232,69,10,.45);}
  .tick svg{width:33px;height:33px;}
  .bname{font-size:31px;font-weight:800;}
  .hook{font-size:44px;font-weight:800;line-height:1.14;letter-spacing:-.5px;margin-bottom:32px;}
  .hook .hl{color:#ff8a4d;}
  .chats{display:flex;flex-direction:column;gap:16px;margin-bottom:26px;}
  .q{align-self:flex-start;background:#2a221c;color:#e7ded6;font-size:27px;font-weight:600;padding:16px 26px;border-radius:22px 22px 22px 6px;}
  .q.dim{opacity:.62;} .q.dim2{opacity:.4;}
  .reply{align-self:flex-end;max-width:760px;background:#e8450a;color:#fff;font-size:27px;font-weight:600;line-height:1.4;padding:20px 28px;border-radius:22px 22px 6px 22px;box-shadow:0 10px 24px rgba(232,69,10,.4);}
  .reply b{font-weight:800;}
  .rtag{align-self:flex-end;font-size:21px;font-weight:800;color:#ff8a4d;margin-bottom:6px;}
  .foot{margin-top:26px;display:flex;align-items:center;justify-content:space-between;font-size:27px;font-weight:700;color:#d9d2cb;}
  .foot b{color:#fff;}
  .u{font-weight:800;color:#fff;}.u span{color:#ff8a4d;}
</style></head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="tick"><svg viewBox="0 0 100 100" fill="none"><path d="M36 39 C36 25 64 25 64 39" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M25 39 h50 a5.5 5.5 0 0 1 5.5 6 l-3 35 a7.5 7.5 0 0 1 -7.5 6.5 H30 a7.5 7.5 0 0 1 -7.5 -6.5 l-3 -35 a5.5 5.5 0 0 1 5.5 -6 Z" stroke="#fff" stroke-width="7" stroke-linejoin="round"/><path d="M37 60 l8 9 17 -18" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="bname">ĐơnThật</span>
    </div>
    <div class="hook">Dưới mỗi bài đăng:<br>"ib mình giá ạ" <span class="hl">× 50 lần?</span></div>
    <div class="chats">
      <span class="q">ib giá ạ</span>
      <span class="q dim">shop ơi bao nhiêu tiền</span>
      <span class="q dim2">inbox giá với ạ</span>
      <div class="rtag">MẪU TRẢ-LỜI-NHANH TRONG KIT ↓</div>
      <span class="reply">Dạ giá + size + cách đặt em để sẵn ở đây ạ, mình bấm xem &amp; chốt ngay nhé: <b>donthat.vercel.app</b></span>
    </div>
    <div class="foot"><span>Trả 50 khách <b>không cần gõ tay từng người</b></span><span class="u">donthat<span>.vercel.app</span></span></div>
  </div>
</body></html>
