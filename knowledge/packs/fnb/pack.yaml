  - "PCCC — TCVN 5738:2021"
  - "Luật An toàn thực phẩm 2010"

# Tên-kép tầng phòng-ngành (luồng generic v3, spec 04 §4.3/§7): phòng pack thêm vẫn cần maps_to về K*/dept-* gần nhất.
dept_maps_to:
  13-kitchen: "K4/dept-09 (+K5/dept-05)"   # Sản-xuất & Chuẩn-hoá món
  14-food-safety: "K1/dept-01"             # An-toàn thực-phẩm (rủi-ro)
