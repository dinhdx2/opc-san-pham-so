<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1680px;height:720px;}
  body{font-family:'Liberation Sans','DejaVu Sans',sans-serif;background:#f4f1ee;
    display:flex;align-items:center;justify-content:center;gap:70px;padding:40px;}
  .item{display:flex;flex-direction:column;align-items:center;gap:22px;width:440px;}
  .ava{width:400px;height:400px;border-radius:50%;
    background:radial-gradient(300px 300px at 38% 30%,#ff7a34 0%,#e8450a 52%,#c43a08 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 18px 40px rgba(232,69,10,.28);}
  .ava svg{width:236px;height:236px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.22));}
  .cap{text-align:center;}
  .cap b{display:block;font-size:30px;color:#1a1a1a;font-weight:800;}
  .cap span{display:block;font-size:20px;color:#6b6b6b;font-weight:600;margin-top:4px;}
  .num{font-size:19px;font-weight:800;color:#e8450a;}
</style></head>
<body>
  <!-- 1: Túi đơn + tick (commerce + thật) -->
  <div class="item">
    <div class="ava">
      <svg viewBox="0 0 100 100" fill="none">
        <!-- quai túi -->
        <path d="M37 40 C37 27 63 27 63 40" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
        <!-- thân túi -->
        <path d="M28 40 h44 a4 4 0 0 1 4 4 l-3 34 a6 6 0 0 1 -6 5 H33 a6 6 0 0 1 -6 -5 l-3 -34 a4 4 0 0 1 4 -4 Z" stroke="#fff" stroke-width="6.5" stroke-linejoin="round"/>
        <!-- tick trong túi -->
        <path d="M38 60 l7 8 15 -16" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="cap"><span class="num">HƯỚNG 1</span><b>Túi đơn + tick</b><span>Đơn hàng (túi) đã xác-nhận (✓) = "đơn thật"</span></div>
  </div>

  <!-- 2: Chữ Đ (đầu tên, nét Việt) ôm tick -->
  <div class="item">
    <div class="ava">
      <svg viewBox="0 0 100 100" fill="none">
        <!-- thân chữ Đ: vòng D -->
        <path d="M33 22 H55 a26 28 0 0 1 0 56 H33 Z" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
        <!-- gạch ngang chữ Đ -->
        <path d="M22 50 H41" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        <!-- tick nằm trong bụng chữ (khoảng âm) -->
        <path d="M47 49 l6 7 12 -14" stroke="#ffd9c7" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="cap"><span class="num">HƯỚNG 2</span><b>Chữ Đ + tick</b><span>Chữ "Đ" (nét riêng của tiếng Việt) ôm dấu ✓</span></div>
  </div>

  <!-- 3: Thông báo "đơn mới về" -->
  <div class="item">
    <div class="ava">
      <svg viewBox="0 0 100 100" fill="none">
        <!-- bong bóng thông báo -->
        <path d="M28 30 h44 a8 8 0 0 1 8 8 v22 a8 8 0 0 1 -8 8 H45 l-13 12 v-12 h-4 a8 8 0 0 1 -8 -8 V38 a8 8 0 0 1 8 -8 Z" stroke="#fff" stroke-width="6.5" stroke-linejoin="round"/>
        <!-- tick trong bong bóng -->
        <path d="M38 48 l7 8 16 -17" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- chấm báo "đơn mới" -->
        <circle cx="76" cy="26" r="9" fill="#fff2ea" stroke="#e8450a" stroke-width="4"/>
      </svg>
    </div>
    <div class="cap"><span class="num">HƯỚNG 3</span><b>Đơn mới về!</b><span>Thông báo "Bạn có đơn hàng mới" — khoảnh-khắc khát-khao</span></div>
  </div>
</body></html>
